plugins {
    id 'com.android.application'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.kossine.crestroncontrol"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    dataBinding{
        enabled=true
    }
    namespace 'com.kossine.opendmcontroller'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.8.8'
    implementation 'androidx.navigation:navigation-ui:2.8.8'
    implementation files('libs/commons-net-3.11.1.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // Preferences DataStore


    implementation 'androidx.datastore:datastore-preferences:1.1.3'


    // Lifecycle components



    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'


    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'


    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'


    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'


    // Kotlin coroutines components


    //implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'


    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'


    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

